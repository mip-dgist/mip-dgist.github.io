{{ $branding := partialCached "functions/get_branding" . "branding" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ $branding.name }},
  "alternateName": ["DGIST MIP Lab", "mip-dgist.github.io"],
  {{- if site.Params.hugoblox.search.enable }}
  "potentialAction": {
    "@type": "SearchAction",
    "target": {{ printf "%s?q={search_term_string}" site.BaseURL }},
    "query-input": "required name=search_term_string"
  },
  {{- end }}
  "url": {{ site.BaseURL }}
}
</script>
